name: Release

# Push a tag such as v0.1.0 on main. The release gets the APK under one fixed
# name, so this link always downloads the newest build:
# https://github.com/jamditis/flack/releases/latest/download/flack.apk
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag must point at a commit on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: bash scripts/check-forbidden-files.sh
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@7296c772c13d12d9871528814b51fb2143c138ef # v6.4.1
      - name: Build with the tag as the version
        env:
          TAG: ${{ github.ref_name }}
        run: ./gradlew --no-daemon -PversionName="${TAG#v}" -PversionCode="$GITHUB_RUN_NUMBER" testDebugUnitTest lintDebug assembleDebug
      - run: bash scripts/check-apk-permissions.sh app/build/outputs/apk/debug/app-debug.apk
      - name: Publish the release with the APK and its checksum
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk flack.apk
          sha256sum flack.apk > flack.apk.sha256
          link="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/flack.apk"
          notes=$(printf '%s\n\n%s\n\n%s\n' \
            "**Download on your phone:** [flack.apk]($link)" \
            "Experiment build, not yet tested in a car. Debug-signed: uninstall the old version before installing this one." \
            "Install and test steps: https://github.com/$GITHUB_REPOSITORY/blob/main/docs/INSTALL.md")
          gh release create "$TAG" flack.apk flack.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" --latest --notes "$notes" --generate-notes \
            --title "$TAG"
