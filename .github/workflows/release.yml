name: Release

# Push a tag such as v0.1.0 on main to attach a debug APK to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/check-forbidden-files.sh
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@7296c772c13d12d9871528814b51fb2143c138ef # v6.4.1
      - run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - run: bash scripts/check-apk-permissions.sh app/build/outputs/apk/debug/app-debug.apk
      - name: Publish a prerelease with the APK and its checksum
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          apk="slack-car-bridge-${TAG}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          gh release create "$TAG" "$apk" "$apk.sha256" \
            --repo "$GITHUB_REPOSITORY" --prerelease --generate-notes \
            --title "$TAG (debug build)"
