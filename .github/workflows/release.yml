name: Release

# Push a tag such as v0.1.0 on a commit in main. The release gets a signed APK
# under one fixed name, so this link always downloads the newest build:
# https://github.com/jamditis/flack/releases/latest/download/flack.apk
# Setup and key handling: docs/RELEASING.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      # Signed build provenance and SBOM attestations for flack.apk.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag must point at a commit on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: bash scripts/check-forbidden-files.sh
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Unpack the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.FLACK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing FLACK_KEYSTORE_BASE64 secret. See docs/RELEASING.md."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/flack-release.jks"
          echo "FLACK_KEYSTORE_FILE=$RUNNER_TEMP/flack-release.jks" >> "$GITHUB_ENV"
      - name: Test and build the signed release
        env:
          TAG: ${{ github.ref_name }}
          FLACK_KEYSTORE_PASSWORD: ${{ secrets.FLACK_KEYSTORE_PASSWORD }}
          FLACK_KEY_ALIAS: ${{ secrets.FLACK_KEY_ALIAS }}
          FLACK_KEY_PASSWORD: ${{ secrets.FLACK_KEY_PASSWORD }}
        run: ./gradlew --no-daemon -PversionName="${TAG#v}" -PversionCode="$GITHUB_RUN_NUMBER" ":app:testDebugUnitTest" ":app:lintRelease" ":app:assembleRelease" ":app:cyclonedxDirectBom"
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/flack-release.jks"
      - name: The APK is signed and asks only for allowed permissions
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "No signed APK was produced. Check the signing secrets."; exit 1; }
          bash scripts/check-apk-permissions.sh "$apk"
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          echo "apksigner: $apksigner"
          certs=$("$apksigner" verify --print-certs "$apk")
          echo "$certs"
          # SHA-256 of the Flack release certificate (public; see docs/RELEASING.md).
          echo "$certs" | grep -qi 'SHA-256 digest: b5d3f41248d794f636662025f24bfe06e7919ab98d7b60cf7913aa80e108c724' \
            || { echo "The APK is not signed with the Flack release key."; exit 1; }
      - name: Name the release files
        run: |
          cp app/build/outputs/apk/release/app-release.apk flack.apk
          cp app/build/reports/cyclonedx-direct/bom.json flack-sbom.json
          sha256sum flack.apk > flack.apk.sha256
      - name: Attest where flack.apk was built
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: flack.apk
      - name: Attest what is inside flack.apk
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: flack.apk
          sbom-path: flack-sbom.json
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          link="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/flack.apk"
          notes=$(cat <<NOTES
          ## Install

          On your Android phone, open **[flack.apk]($link)**. That link always gets the newest release.

          Then follow the [install steps](https://github.com/$GITHUB_REPOSITORY/blob/main/docs/INSTALL.md). Flack needs Android 12 or later, and Android Auto's Unknown sources developer setting.

          This is an experiment build. It has not been tested in a car yet.

          To check the file, compare its SHA-256 with flack.apk.sha256 below, or confirm GitHub built it from this repository:

          \`gh attestation verify flack.apk --repo $GITHUB_REPOSITORY\`

          flack-sbom.json lists every library inside the APK.
          NOTES
          )
          # A release made on the Releases page already exists for this tag: add the
          # files to it instead of failing on a second create.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" flack.apk flack.apk.sha256 flack-sbom.json --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --latest
          else
            gh release create "$TAG" flack.apk flack.apk.sha256 flack-sbom.json \
              --repo "$GITHUB_REPOSITORY" --latest --title "Flack $TAG" \
              --notes "$notes" --generate-notes
          fi
